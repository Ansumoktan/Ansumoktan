          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.95"
          filter="url(#glow)">
      <animate attributeName="stroke-dasharray" from="0,6000" to="1200,4800" dur="2s" begin="0s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="0" to="-7200" dur="6s" repeatCount="indefinite" />
